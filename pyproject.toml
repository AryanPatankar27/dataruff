[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataruff"
version = "0.1.0"
description = "One-command dataset health diagnostics — the Ruff of datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "dataruff contributors" }]
keywords = ["data quality", "pandas", "csv", "data validation", "EDA", "data science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
rich = ["rich>=13.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "rich>=13.0",
]

[project.scripts]
dataruff = "datadoctor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datadoctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=datadoctor --cov-report=term-missing --cov-report=html -v"

[tool.coverage.run]
source = ["datadoctor"]
omit = ["tests/*", "datadoctor/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
